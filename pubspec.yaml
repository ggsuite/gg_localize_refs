version: 5.1.1
repository: https://github.com/ggsuite/gg_localize_refs.git

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  args: ^2.7.0
  gg_args: ^3.2.0
  gg_console_colors: ^2.5.0
  gg_log: ^1.2.0
  gg_process: ^1.3.0
  path: ^1.9.1
  yaml: ^3.1.4
  yaml_edit: ^2.2.4
  gg_project_root: ^2.2.3
  pubspec_parse: ^1.7.0
  pub_semver: ^2.2.1
  glob: ^2.2.0
  gg_git: ^4.5.5
  gg_publish: ^4.10.2
dev_dependencies:
  dna_ggsuite: ^1.0.0
  gg_capture_print: ^1.2.1
  helix: ^1.14.0
  lints: ^6.1.0
  test: ^1.33.0

executables:
  gg_localize_refs: